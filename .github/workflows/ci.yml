# Quick checks on every push and pull request: lint, then start the app off-screen.
# Release builds live in release.yml and run only for version tags.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0

      - name: Install
        run: python -m pip install -e . pyflakes

      - name: Lint
        run: python -m pyflakes hostrix packaging

      - name: Self-test
        env:
          QT_QPA_PLATFORM: offscreen
          HOSTRIX_HOME: ${{ runner.temp }}/hostrix
        run: |
          hostrix --version
          hostrix import examples/inventory.example.json
          hostrix list
          hostrix selftest
