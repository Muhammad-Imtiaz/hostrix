# Builds the app on Linux, macOS and Windows and publishes a GitHub release.
#
#   git tag -a v1.2.3 -m "v1.2.3" && git push origin v1.2.3
#
# The release notes come from docs/releases/<tag>.md. Running the workflow by hand
# ("Run workflow" in the Actions tab) only builds and uploads the packages as artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04   # oldest supported runner = widest glibc compatibility
          - name: macOS
            os: macos-latest   # Apple Silicon
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6"

      - name: Build packages
        run: python packaging/build.py

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/hostrix/hostrix --version
          dist/hostrix/hostrix selftest

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "dist/Hostrix.app/Contents/MacOS/hostrix" --version
          "dist/Hostrix.app/Contents/MacOS/hostrix" selftest

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # a windowed app does not write to the console, so check the exit code
          $p = Start-Process -FilePath dist\hostrix\hostrix.exe -ArgumentList selftest -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
          Write-Host "selftest ok"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: packages-*
          merge-multiple: true

      - name: Version-free copies for "latest" download links
        # README links like releases/latest/download/hostrix-macos-arm64.dmg always get the newest build
        run: |
          cd release
          ver="${GITHUB_REF_NAME#v}"
          for f in *; do
            stable="${f/_${ver}_/-linux-}"     # hostrix_X_amd64.deb -> hostrix-linux-amd64.deb
            stable="${stable/-${ver}-/-}"      # hostrix-X-macos-arm64.dmg -> hostrix-macos-arm64.dmg
            if [ "$stable" != "$f" ]; then cp "$f" "$stable"; fi
          done
          ls -la

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" notes.md; else echo "Hostrix ${GITHUB_REF_NAME}" > notes.md; fi

      - uses: softprops/action-gh-release@v3
        with:
          name: Hostrix ${{ github.ref_name }}
          body_path: notes.md
          files: release/*
          make_latest: true
