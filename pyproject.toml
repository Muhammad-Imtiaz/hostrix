[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hostrix"
version = "0.5.2"
description = "Keep every SSH server in one place and connect with one click"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Muhammad Imtiaz" }]
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.5"]
keywords = ["ssh", "ssh-client", "devops", "sysadmin", "jump-host", "bastion", "server-inventory", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/Muhammad-Imtiaz/hostrix"
Download = "https://github.com/Muhammad-Imtiaz/hostrix/releases/latest"
Issues = "https://github.com/Muhammad-Imtiaz/hostrix/issues"
Changelog = "https://github.com/Muhammad-Imtiaz/hostrix/blob/main/CHANGELOG.md"

[project.scripts]
hostrix = "hostrix.__main__:main"

[tool.setuptools]
packages = ["hostrix"]

[tool.setuptools.package-data]
hostrix = ["assets/*"]
